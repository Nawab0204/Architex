<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%" fill="none">
  <!-- ACHITEX Official Architectural Identity -->

  <!-- 1. Iconic Red R Emblem -->
  <g fill="#D01020">
    <!-- Left vertical stem with distinctive 45-degree angled top cut -->
    <path d="M 16 46 L 46 16 L 46 104 L 16 104 Z" />
    <!-- Upper rounded loop of R -->
    <path d="M 46 16 L 82 16 C 104 16 120 28 120 48 C 120 64 106 72 86 72 L 46 72 Z M 46 32 L 78 32 C 90 32 99 37 99 48 C 99 57 90 60 78 60 L 46 60 Z" />
    <!-- Lower diagonal leg of R with angled foot -->
    <path d="M 68 66 L 102 104 L 128 104 L 88 64 Z" />
  </g>

  <!-- 2. Vertical Red Accent Divider with Center Indicator Pip/Node -->
  <line x1="160" y1="16" x2="160" y2="104" stroke="#D01020" stroke-width="2.5" stroke-linecap="round" />
  <rect x="156.5" y="52" width="7" height="16" rx="2" fill="#D01020" />

  <!-- 3. Wordmark: A C H I T ≡ X -->
  <!-- Black Letters -->
  <g fill="#111111" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="0.32em">
    <text x="195" y="58">A</text>
    <text x="250" y="58">C</text>
    <text x="306" y="58">H</text>
    <text x="366" y="58">I</text>
    <text x="404" y="58">T</text>
    <text x="510" y="58">X</text>
  </g>

  <!-- 3 Red Horizontal Bars for E (≡) -->
  <g transform="translate(458, 29)">
    <rect x="0" y="0" width="26" height="5" fill="#D01020" rx="1" />
    <rect x="0" y="11" width="26" height="5" fill="#D01020" rx="1" />
    <rect x="0" y="22" width="26" height="5" fill="#D01020" rx="1" />
  </g>

  <!-- 4. Sub-bar: ARCHITECTURE | DESIGN | ENGINEERING -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.22em">
    <text x="195" y="94" fill="#111111">ARCHITECTURE</text>
    <text x="328" y="94" fill="#D01020">|</text>
    <text x="345" y="94" fill="#111111">DESIGN</text>
    <text x="424" y="94" fill="#D01020">|</text>
    <text x="441" y="94" fill="#111111">ENGINEERING</text>
  </g>
</svg>
