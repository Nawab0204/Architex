<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0c1824; font-family: 'Space Mono', monospace;">
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#254668" stroke-width="2"/>
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#162e48" stroke-width="1"/>
  
  <!-- Title Block Bottom Right -->
  <rect x="780" y="620" width="390" height="150" fill="#08111b" stroke="#376899" stroke-width="1.5"/>
  <text x="800" y="650" fill="#6ba7df" font-size="11" letter-spacing="2">REAL LIFE ARCHITECTURE • BIRMINGHAM</text>
  <text x="800" y="675" fill="#f0f4f8" font-size="16" font-weight="bold" letter-spacing="1">EDGBASTON PAVILION — CONSERVATION PLAN</text>
  <text x="800" y="700" fill="#8cb9e5" font-size="11">DRAWING NO: EP-01 • SCALE: 1:50 @ A1 • EDGBASTON CONSERVATION AREA</text>
  <text x="800" y="725" fill="#588bb8" font-size="10">PATINATED BRONZE CLADDING &amp; STRUCTURAL GLASS LINK</text>
  <text x="800" y="745" fill="#c51b18" font-size="10" font-weight="bold">CALTHORPE ESTATE APPROVAL COMPLIANT</text>

  <!-- North Arrow -->
  <g transform="translate(1080, 100)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#6ba7df" stroke-width="1.5"/>
    <polygon points="0,-24 7,8 0,3 -7,8" fill="#c51b18"/>
    <text x="-4" y="-30" fill="#f0f4f8" font-size="12" font-weight="bold">N</text>
  </g>

  <!-- Victorian Villa Outline (Retained) -->
  <rect x="120" y="160" width="460" height="480" fill="#13273d" stroke="#6ba7df" stroke-width="4"/>
  <text x="240" y="240" fill="#f0f4f8" font-size="15" font-weight="bold">HISTORIC VICTORIAN VILLA</text>
  <text x="240" y="265" fill="#8cb9e5" font-size="11">ORIGINAL BRICK MASONRY RESTORED</text>

  <!-- Glass Link -->
  <rect x="580" y="320" width="100" height="160" fill="#0e2840" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="630" y="405" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">FRAMELESS GLASS LINK (4.2m)</text>

  <!-- Contemporary Garden Pavilion -->
  <polygon points="680,240 1060,200 1060,560 680,520" fill="#173552" stroke="#6ba7df" stroke-width="3.5"/>
  <text x="760" y="360" fill="#f0f4f8" font-size="15" font-weight="bold">SCULPTURAL GARDEN PAVILION</text>
  <text x="760" y="385" fill="#8cb9e5" font-size="11">BRONZE CLAD FOLDED ROOF • CLERESTORY DAYLIGHT</text>
  <text x="760" y="410" fill="#8cb9e5" font-size="11">FULL-HEIGHT CORNER PIVOT APERTURE</text>

  <!-- Dimension line -->
  <line x1="680" y1="580" x2="1060" y2="580" stroke="#8cb9e5" stroke-width="1.5"/>
  <line x1="680" y1="570" x2="680" y2="590" stroke="#8cb9e5" stroke-width="1.5"/>
  <line x1="1060" y1="570" x2="1060" y2="590" stroke="#8cb9e5" stroke-width="1.5"/>
  <text x="870" y="605" fill="#8cb9e5" font-size="12" text-anchor="middle">9,800 mm PAVILION SPAN</text>
